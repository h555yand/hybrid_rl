# ═══════════════════════════════════════════
# EVAL: train objects + held-out
# ═══════════════════════════════════════════
eval_meshes:
  # Train set — primitives
  - mesh: cube
    curriculum_filters:
      - {same_side: true, path_blocked: false}
      - {same_side: true, path_blocked: true}
      - {}
  - mesh: sphere
    curriculum_filters:
      - {same_side: true, path_blocked: false}
      - {same_side: true, path_blocked: true}
      - {}
  #- mesh: cylinder
  #  curriculum_filters:
  #    - {same_side: true, path_blocked: false}
  #    - {same_side: true, path_blocked: true}
  #    - {}
  #- mesh: flat_square
  #  curriculum_filters:
  #    - {same_side: true, path_blocked: false}
  #    - {same_side: true, path_blocked: true}
  #    - {}
  #- mesh: cone
  #  curriculum_filters:
  #    - {same_side: true, path_blocked: false}
  #    - {same_side: true, path_blocked: true}
  #    - {}
  #- mesh: thin_cylinder
  #  curriculum_filters:
  #    - {same_side: true, path_blocked: false}
   #   - {same_side: true, path_blocked: true}
  #    - {}
  
  # Train set — hollow
  - vase
  #- mug
  # Held-out — hollow
  #- mesh: cup
  #  pool_seed: 57

eval_episodes_per_level: 100

# BC config (not used in Q-only pipeline)
# ═══ BC data collection ═══
# Which meshes go into BC training data
# Empty list = use all eval_meshes
bc_mesh_names:
  - cube
  - sphere
  - cylinder
  - flat_square
  - cone
  - thin_cylinder
  #- vase
  #- mug

# ═══ BC balancing ═══
bc_total_target: null
bc_mesh_weights:
  cube: 1.0         # простой, но даёт базовые навыки flat surface
  sphere: 1.0        # простой, curved surface — полезно для cone
  cylinder: 1.0      # edge traversal — ключевой для cone, thin_cylinder
  flat_square: 0.5   # очень простой, мало нового
  cone: 1.0
  thin_cylinder: 0.5
  #vase: 2.0          # hollow навигация — ключевой для cup
  #mug: 2.5           # самый сложный, handle+rim — максимум данных

bc_level_weights:
  0: 1.0
  1: 2.0
  2: 2.0 
  
bc_min_per_group: 50
bc_action_min_pct: 0.01
bc_action_min_absolute: 100
bc_q_store_fraction: 0.3

rl_config:
  state_dim: 28
  reward_rim_progress_scale: 2.0
  stuck_threshold: 0.05
  warmup_episodes: 100     # per level warmup
  air_start_enabled: true

  # Feature weights for HNSW stores
  feature_weights_free:
    0: 2.0
    1: 2.0
    2: 2.0
    3: 0.3
    4: 0.3
    5: 0.3
    6: 0.0
    7: 0.0
    8: 0.0
    9: 0.0
    10: 0.0
    11: 0.0
    12: 0.5
    14: 1.0
    19: 0.5
    20: 0.0
    21: 0.0
    22: 0.0
    23: 0.0
    24: 0.0
    25: 0.0
    26: 0.0
    27: 1.0

  # Direct store: crawl to goal / same-side bypass
  feature_weights_surface:
    0: 2.0    # lpe[0]
    1: 2.0    # lpe[1]
    2: 0.5    # lpe[2]
    3: 0.0
    4: 0.0
    5: 0.0
    6: 0.2    # local_normal — неинформативен
    7: 0.2
    8: 0.2
    9: 0.3    # k1
    10: 0.0
    11: 0.0
    12: 1.5   # alignment
    13: 0.3   # distance
    14: 0.0
    15: 0.3   # goal_normal
    16: 0.3
    17: 0.3
    18: 1.0   # path_blocked
    19: 0.0
    20: 0.0   # p2d — убран
    21: 0.0
    22: 0.0   # na — store selector
    23: 0.0   # norm_height — не нужен для direct
    24: 0.3
    25: 0.3
    26: 0.3
    27: 1.0

  # Bypass store: crawl to edge / different-side
  feature_weights_bypass:
    0: 0.5    # lpe[0] — снижен
    1: 0.5    # lpe[1]
    2: 0.3    # lpe[2]
    3: 0.0
    4: 0.0
    5: 0.0
    6: 0.7    # local_normal
    7: 0.7
    8: 0.7
    9: 0.3    # k1
    10: 0.0
    11: 0.0
    12: 1.0   # alignment
    13: 0.3   # distance
    14: 0.0
    15: 0.5   # goal_normal
    16: 0.5
    17: 0.5
    18: 0.0   # path_blocked — всегда 1
    19: 0.0
    20: 0.0   # p2d — убран
    21: 0.0
    22: 0.0   # na — store selector
    23: 2.0   # norm_height — ключевой для bypass
    24: 1.0   # NEW up_local
    25: 1.0
    26: 1.0
    27: 1.0

  mode: train_adapt_epsilon
  goal_threshold: 4.0
  max_points: 10000000
  k_neighbors: 7
  max_steps_per_goal: 500
  adaptive_sigma: true
  insert_threshold: 0.50
  auto_calibrate: false

  # insert update Q
  insert_progress_eps: 0.05          # mm
  bootstrap_progress_eps: 0.0        # mm
  bootstrap_proximity_p0: 0.3
  bootstrap_q_cap: 10.0
  td_error_clip: 10.0          # клип TD-ошибки для стабилизации Q
  tie_q2_z_threshold: 0.0      # насколько "q2 высокий" (z-score)
  tie_t2s_threshold: 0.25      # насколько "почти ничья" по Q (в сырых Q-единицах, после стабилизации)
  tie_confidence_boost: 0.55   # чему поднимать q_confidence в этом кейсе

  # Rewards
  reward_goal_reached: 30.0
  reward_timeout: -12.0
  reward_surface_violation: -12.0
  reward_step_penalty: -0.2
  reward_near_goal_on_surface: 0.5
  reward_progress: 3.0

  # Action space
  surface_step: 3.0
  free_step: 8.0
  free_step_small: 2.0
  rotation_step: 5.0
  num_actions: 24
  rotation_step_big: 15.0
  free_step_backward: 2.0

  # Tactical Q-store
  eval_epsilon: 0.02
  temperature_override: 0.05

  # Strategic Q-store
  strategic_eval_epsilon: 0.02
  strategic_reward_switch_success: 1.0
  strategic_reward_switch_wrong_side: -0.3
  strategic_reward_switch_collision: -0.5
  strategic_reward_stay_when_needed: -0.1
  strategic_reward_stay_correct: 0.3
  strategic_alpha_stay_multiplier: 0.1
  strategic_alpha_switch_multiplier: 1.0
  strategic_reward_stay_when_clear: -0.3
  strategic_reward_switch_when_clear: 0.3
  strategic_reward_stay_orbit_progress: 0.02
  strategic_reward_stay_orbit_stuck: -0.05
  strategic_reward_stay_should_have: 0.2

# SAC (not used in Q-only pipeline)
sac_config:
  load_mode: null
  goal_threshold: 4.0
  gamma: 0.99
  tau: 0.005
  lr_actor: 0.00003
  lr_critic: 0.0003
  batch_size: 256
  bc_lambda_init: 5.0
  bc_lambda_min: 0.5
  actor_warmup_per_level: 50
  buffer_capacity: 1000000
  bc_reserve_fraction: 0.20
  max_steps_per_goal: 500
  eval_interval: 500
  eval_episodes: 50
  use_strategic_override: false
  use_cql: true
  cql_alpha: 1.0

sac_episodes_per_mesh:
  cube: 1000
  sphere: 1000
  cylinder: 1000
  flat_square: 500
  cone: 1000
  thin_cylinder: 500
  #vase: 1000
  #mug: 1000

#sac_episodes_per_mesh:
#  mug:
#    episodes: 3000
#    pool_seed: 301

sac_eval_episodes_per_level: 100

adaptive_mesh: vase
adaptive_episodes: 1000

offline_check_window: 100

sleep_config:
  success_threshold: 0.80
  min_success_trails: 20
  sac_update_steps: 3000
  critic_warmup_steps: 200
  actor_update_every: 5
  actor_lr_scale: 0.3
  bc_lambda_init: 3.0
  bc_lambda_decay: 0.999
  bc_lambda_min: 0.3
  use_cql: true
  cql_alpha: 0.5
  current_mesh_ratio: 0.7
  bc_ratio: 0.2
  elite_ratio: 0.1

sleep_q_norm:
  enabled: true
  min_start_states: 500
  prox_median_threshold: 0.15
  current_mesh_ratio: 0.7      # доля текущего меша в смеси
  start_oversample: 3          # насколько сильнее весим стартовые состояния
  max_states_total: 50000      # сколько states использовать на нормализацию

ycb_config:
  # MuJoCo data: textured.obj + texture_map.png + metadata.json
  mujoco_data_path: ~/Downloads/tbp/data/mujoco/objects/ycb

  # GLB meshes (для конвертации в mm STL)
  ycb_src_dir: ~/Downloads/simulator_data/objects/ycb/meshes

  # {local_name: [mujoco_folder, glb_folder]}
  # mujoco_folder = имя в mujoco_data_path
  # glb_folder = имя в ycb_src_dir (для конвертации в mm STL)
  objects:
    ycb_mug:
      mujoco_name: mug
      glb_name: 025_mug
    ycb_bowl:
      mujoco_name: bowl
      glb_name: 024_bowl
    ycb_can:
      mujoco_name: master_chef_can
      glb_name: 002_master_chef_can
    ycb_banana:
      mujoco_name: banana
      glb_name: 011_banana
    ycb_cracker_box:
      mujoco_name: cracker_box
      glb_name: 003_cracker_box

    #ycb_cups:
    #  mujoco_name: a_cups
    #  glb_name: 065-a_cups
    #ycb_foam_brick:
    #  mujoco_name: foam_brick
    #  glb_name: 061_foam_brick
    #ycb_apple:
    #  mujoco_name: apple
    #  glb_name: 013_apple
    #ycb_sugar_box:
    #  mujoco_name: sugar_box
    #  glb_name: 004_sugar_box
    #ycb_mustard:
    #  mujoco_name: mustard_bottle
    #  glb_name: 006_mustard_bottle

  episodes_per_level: 30
  max_steps: 500

logging:
  run_name: adapt-baseline
  output_dir: ./results/adapt-baseline
