    episodes: 1000
    epsilon_start: 1.0
    epsilon_min: 0.95
    load_mode: null
    warmup_episodes: 100
    promote_threshold: 0.7
    promote_window: 200
    curriculum_filters:
      - {same_side: true, path_blocked: false}
      - {same_side: true, path_blocked: true}
      - {}

  - mesh: sphere
    episodes: 1000
    epsilon_start: 1.0
    epsilon_min: 0.95
    load_mode: auto
    warmup_episodes: 100
    promote_threshold: 0.7
    promote_window: 200
