[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rl"
version = "0.1.0"
description = "Bio-inspired hybrid RL system for goal-directed 3D navigation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aleksey Isaev", email = "aleksey.isaev@gmail.com"},
]
keywords = [
    "reinforcement-learning",
    "navigation",
    "3d-surface",
    "episodic-memory",
    "soft-actor-critic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "hnswlib>=0.7",
    "trimesh>=4.0",
    "pyyaml>=6.0",
    "pybullet",
    # Прямая ссылка на Git-репозиторий оформляется через @ и ключевое слово git+
    "gym-pybullet-drones @ git+https://github.com/utiasDSL/gym-pybullet-drones.git",
    "rtree",
    "manifold3d",
    "pyrender",
    "omegaconf"
]

[project.optional-dependencies]
dev = [
    # Check for undeclared dependencies
    "deptry",

    # Python static type checker
    "mypy==1.11.2",

    # Testing, code style, etc...
    "pytest==7.1.1",
    "pytest-xdist==2.5.0",
    "pytest-cov==3.0.0",

    # Python linter and formatter
    "ruff==0.14.2",
]

[project.urls]
Homepage = "https://github.com/h555yand/hybrid-rl"
Documentation = "https://github.com/h555yand/hybrid-rl"
Repository = "https://github.com/h555yand/hybrid-rl"
Issues = "https://github.com/h555yand/hybrid-rl/issues"

[tool.setuptools.packages.find]
include = ["hybrid_rl*"]
