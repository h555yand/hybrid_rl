[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid_rl"
version = "0.1.0"
description = "Bio-inspired hybrid RL system for goal-directed 3D navigation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aleksey Isaev", email = "aleksey.isaev@gmail.com"},
]
keywords = [
    "reinforcement-learning",
    "navigation",
    "3d-surface",
    "episodic-memory",
    "soft-actor-critic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.10",
    "torch",
    "hnswlib>=0.7",
    "trimesh>=4.0",
    "pyyaml>=6.0",
    "rtree",
    "omegaconf",
]

[project.optional-dependencies]
drones = [
    "pybullet",
    "gym-pybullet-drones @ git+https://github.com/utiasDSL/gym-pybullet-drones.git",
]
viz = [
    "pyrender",
    "manifold3d",
]
dev = [
    "deptry",
    "mypy==1.11.2",
    "pytest==7.1.1",
    "pytest-xdist==2.5.0",
    "pytest-cov==3.0.0",
    "ruff==0.14.2",
]
all = [
    "hybrid_rl[drones,viz,dev]",
]

[project.urls]
Homepage = "https://github.com/h555yand/hybrid_rl"
Repository = "https://github.com/h555yand/hybrid_rl"
Issues = "https://github.com/h555yand/hybrid_rl/issues"

[tool.setuptools.packages.find]
include = ["hybrid_rl*"]
